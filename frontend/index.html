<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamified Learning Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="nav-bar" aria-label="Main navigation">
            <a href="dashboard.html" class="nav-logo" aria-label="FSRS Learner home">⚡Gamified Learning</a>
            <ul class="nav-links" role="list">
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="index.html" class="nav-link active" aria-current="page">Quiz</a></li>
                <li><a href="upload.html" class="nav-link">Upload Content</a></li>
                <li><a href="edit.html" class="nav-link">Manage</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="dynamic-content" id="quiz-container" aria-label="Quiz">

            <article class="card" aria-label="Flashcard">
                <header class="card-header">
                    <span class="status-badge">Due</span>
                    <p class="card-progress" aria-label="Progress">Question 1 of 10</p>
                </header>

                <section class="question-front" aria-label="Question">
                    What is the capital of France?
                </section>

                <div class="options-grid" id="options-container" aria-label="Multiple Choice Options">
                    <!-- Options injected via JS -->
                </div>
            </article>

        </section>
    </main>

    <script src="quiz.js"></script>
</body>
</html>
